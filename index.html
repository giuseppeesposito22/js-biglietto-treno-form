<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- font awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel=" icon" href="./img/boolean.png" type="image/x-icon" />

    <!-- bootstrap  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>

    <title>Biglietto Treno</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-6">
          <form id="ticket-form" action="" class="d-flex flex-column gy-5">
            <label for=""> Nome Cognome </label>
            <input id="input-name-surname" type="text" value="" />

            <label for=""> Kilometri da percorrere </label>
            <input id="input-km" type="number" value="" />

            <label for="">Fascia d'età</label>
            <select
              id="input-select"
              class="form-select"
              aria-label="Default select example"
            >
              <option selected>Maggiorenne</option>
              <option id="option-select-underage" value="17">Minorenne</option>

              <option id="option-select-over65" value="66">Over65</option>
            </select>
            <div class="text-center mt-3">
              <button id="button-confirm" class="btn btn-outline-success">
                conferma
              </button>
              <button id="button-reset" class="btn btn-outline-danger">
                annulla
              </button>
            </div>
          </form>
        </div>
        <div class="col-6">
          <div class="card d-none" style="width: 18rem">
            <div class="card-header">Ticket</div>
            <ul class="list-group list-group-flush">
              <li id="name-card" class="list-group-item"></li>

              <li id="km-card" class="list-group-item"></li>
              <li id="final-price-card" class="list-group-item"></li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
